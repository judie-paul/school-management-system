{{define "content"}}
<div class="card narrow">
  <h1>Staff login</h1>
  <form method="post" action="/login" class="stack">
    {{template "csrf" .CSRF}}
    <div class="field"><label for="username">Username</label>
      <input type="text" id="username" name="username" value="{{.Data}}" required autofocus autocomplete="username"></div>
    <div class="field"><label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password"></div>
    <button>Log in</button>
  </form>
  <p class="muted">Parent? <a href="/parent/login">Log in to the parent portal</a>.</p>
</div>
{{end}}
